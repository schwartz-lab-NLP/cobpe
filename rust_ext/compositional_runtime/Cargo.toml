[package]
name = "nanochat_compositional_rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[lib]
name = "nanochat_compositional_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.11.0"
rustc-hash = "1.1.0"
rayon = "1.11.0"
